<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de sugerencias — Posada de fin de año</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #1a2027;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121820; color: #e8eef5; }
    header { background: #1b232e !important; border-color: #2b3644 !important; }
    .placeholder { background: #1b232e !important; border-color: #2b3644 !important; }
  }
  header {
    background: #fff; border-bottom: 1px solid #dde3ea;
    padding: 32px 20px 24px;
    text-align: center;
  }
  h1 {
    font-size: clamp(22px, 6vw, 30px);
    margin: 0 0 10px;
  }
  header p {
    margin: 0 auto; max-width: 480px;
    line-height: 1.55; font-size: 16px;
    opacity: .85;
  }
  main {
    max-width: 600px; margin: 0 auto;
    padding: 24px 20px 48px;
  }
  .placeholder {
    background: #fff; border: 1px dashed #c3ccd6; border-radius: 14px;
    padding: 40px 24px; text-align: center;
    color: inherit; opacity: .75;
  }
  .placeholder p { margin: 0; line-height: 1.55; }
  .seccion { margin-bottom: 28px; }
  .seccion h2 {
    font-size: 18px; margin: 0 0 12px;
  }
  .seccion ul {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  @media (prefers-color-scheme: dark) {
    .seccion li { background: #1b232e !important; border-color: #2b3644 !important; }
  }
  .seccion li {
    background: #fff; border: 1px solid #dde3ea; border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .seccion .etiqueta { line-height: 1.4; }
  .seccion .votos {
    font-size: 13px; opacity: .7; white-space: nowrap;
  }
  .seccion .acciones {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .seccion button {
    border: 1px solid #c3ccd6; background: #eef2f6; color: inherit;
    border-radius: 8px; padding: 8px 14px;
    font-size: 14px; cursor: pointer;
  }
  .seccion button:active { transform: translateY(1px); }
  .seccion .vacio { opacity: .7; font-size: 14px; }
  .tabla-fechas {
    background: #fff; border: 1px solid #dde3ea; border-radius: 14px;
    padding: 24px; overflow-x: auto;
  }
  @media (prefers-color-scheme: dark) {
    .tabla-fechas { background: #1b232e !important; border-color: #2b3644 !important; }
    .tabla-fechas table th { border-color: #2b3644 !important; }
    .tabla-fechas table td { border-color: #2b3644 !important; }
  }
  .tabla-fechas h2 { font-size: 18px; margin: 0 0 12px; }
  .tabla-fechas table {
    width: 100%; border-collapse: collapse; font-size: 14px;
  }
  .tabla-fechas th, .tabla-fechas td {
    text-align: left; padding: 10px 8px;
    border-bottom: 1px solid #dde3ea;
  }
  .tabla-fechas th:last-child, .tabla-fechas td:last-child { text-align: right; }
  .tabla-fechas form {
    display: flex; gap: 8px; margin-top: 16px;
  }
  .tabla-fechas input[type="text"] {
    flex: 1; min-width: 0;
    padding: 8px 10px; border: 1px solid #c3ccd6; border-radius: 8px;
    font-size: 14px; background: inherit; color: inherit;
  }
  .tabla-fechas .vacio { opacity: .7; font-size: 14px; }
  .tabla-fechas h2.segunda { margin-top: 28px; }
</style>
</head>
<body>
  <header>
    <h1>Buzón de sugerencias — Posada de fin de año</h1>
    <p>Ayúdanos a organizar la posada de este año: cuéntanos qué fecha
       propones y dónde te gustaría que fuera la cena.</p>
  </header>
  <main>
    <section class="seccion">
      <ul id="lista-fechas"></ul>
    </section>
    <section class="seccion">
      <ul id="lista-lugares"></ul>
    </section>
    <div class="tabla-fechas">
      <h2>Propón y vota una fecha</h2>
      <table>
        <thead>
          <tr>
            <th>Fecha propuesta</th>
            <th>Votos</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-fechas-cuerpo"></tbody>
      </table>
      <form id="form-fecha">
        <input type="text" id="input-fecha" placeholder="Ej. Viernes 12 de diciembre" maxlength="200" required>
        <button type="submit">Proponer</button>
      </form>

      <h2 class="segunda">Propón y vota un restaurante</h2>
      <table>
        <thead>
          <tr>
            <th>Restaurante propuesto</th>
            <th>Votos</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-lugares-cuerpo"></tbody>
      </table>
      <form id="form-lugar">
        <input type="text" id="input-lugar" placeholder="Ej. Trattoria Roma" maxlength="200" required>
        <button type="submit">Proponer</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      "https://mguzayplgdoxubfatwsy.supabase.co",
      "sb_publishable_04ZLX99calb5dgi5Ekkxag_WE9K5kp9"
    );

    function crearFila(texto, votos, onVotar) {
      const li = document.createElement("li");

      const etiqueta = document.createElement("span");
      etiqueta.className = "etiqueta";
      etiqueta.textContent = texto;

      const acciones = document.createElement("div");
      acciones.className = "acciones";

      const contador = document.createElement("span");
      contador.className = "votos";
      contador.textContent = votos === 1 ? "1 voto" : votos + " votos";

      const boton = document.createElement("button");
      boton.type = "button";
      boton.textContent = "Votar";
      boton.addEventListener("click", async () => {
        boton.disabled = true;
        try {
          await onVotar();
          votos += 1;
          contador.textContent = votos === 1 ? "1 voto" : votos + " votos";
        } finally {
          boton.disabled = false;
        }
      });

      acciones.appendChild(contador);
      acciones.appendChild(boton);
      li.appendChild(etiqueta);
      li.appendChild(acciones);
      return li;
    }

    async function cargarFechas() {
      const lista = document.getElementById("lista-fechas");
      const { data, error } = await supabase
        .from("fechas_propuestas")
        .select("id, etiqueta, votos")
        .order("votos", { ascending: false });

      if (error || !data || data.length === 0) {
        const li = document.createElement("li");
        li.className = "vacio";
        li.textContent = "Todavía no hay propuestas de fecha.";
        lista.appendChild(li);
        return;
      }

      data.forEach((fila) => {
        lista.appendChild(
          crearFila(fila.etiqueta, fila.votos, async () => {
            await supabase.rpc("votar_fecha", { fecha_id: fila.id });
          })
        );
      });
    }

    async function cargarLugares() {
      const lista = document.getElementById("lista-lugares");
      const { data, error } = await supabase
        .from("lugares_propuestas")
        .select("id, nombre, votos")
        .order("votos", { ascending: false });

      if (error || !data || data.length === 0) {
        const li = document.createElement("li");
        li.className = "vacio";
        li.textContent = "Todavía no hay propuestas de lugares.";
        lista.appendChild(li);
        return;
      }

      data.forEach((fila) => {
        lista.appendChild(
          crearFila(fila.nombre, fila.votos, async () => {
            await supabase.rpc("votar_lugar", { lugar_id: fila.id });
          })
        );
      });
    }

    function crearFilaTabla(texto, votos, onVotar) {
      const tr = document.createElement("tr");

      const tdEtiqueta = document.createElement("td");
      tdEtiqueta.textContent = texto;

      const tdVotos = document.createElement("td");
      tdVotos.textContent = votos;

      const tdBoton = document.createElement("td");
      const boton = document.createElement("button");
      boton.type = "button";
      boton.textContent = "Votar";
      boton.addEventListener("click", async () => {
        boton.disabled = true;
        try {
          await onVotar();
          votos += 1;
          tdVotos.textContent = votos;
        } finally {
          boton.disabled = false;
        }
      });
      tdBoton.appendChild(boton);

      tr.appendChild(tdEtiqueta);
      tr.appendChild(tdVotos);
      tr.appendChild(tdBoton);
      return tr;
    }

    async function cargarTablaFechas() {
      const cuerpo = document.getElementById("tabla-fechas-cuerpo");
      cuerpo.innerHTML = "";
      const { data, error } = await supabase
        .from("fechas_propuestas")
        .select("id, etiqueta, votos")
        .order("votos", { ascending: false });

      if (error || !data || data.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 3;
        td.className = "vacio";
        td.textContent = "Todavía no hay fechas propuestas.";
        tr.appendChild(td);
        cuerpo.appendChild(tr);
        return;
      }

      data.forEach((fila) => {
        cuerpo.appendChild(
          crearFilaTabla(fila.etiqueta, fila.votos, async () => {
            await supabase.rpc("votar_fecha", { fecha_id: fila.id });
          })
        );
      });
    }

    async function cargarTablaLugares() {
      const cuerpo = document.getElementById("tabla-lugares-cuerpo");
      cuerpo.innerHTML = "";
      const { data, error } = await supabase
        .from("lugares_propuestas")
        .select("id, nombre, votos")
        .order("votos", { ascending: false });

      if (error || !data || data.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 3;
        td.className = "vacio";
        td.textContent = "Todavía no hay restaurantes propuestos.";
        tr.appendChild(td);
        cuerpo.appendChild(tr);
        return;
      }

      data.forEach((fila) => {
        cuerpo.appendChild(
          crearFilaTabla(fila.nombre, fila.votos, async () => {
            await supabase.rpc("votar_lugar", { lugar_id: fila.id });
          })
        );
      });
    }

    document.getElementById("form-fecha").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const input = document.getElementById("input-fecha");
      const etiqueta = input.value.trim();
      if (!etiqueta) return;

      const boton = evento.target.querySelector("button");
      boton.disabled = true;
      try {
        const { error } = await supabase.rpc("agregar_fecha", { etiqueta_nueva: etiqueta });
        if (!error) {
          input.value = "";
          await cargarTablaFechas();
        }
      } finally {
        boton.disabled = false;
      }
    });

    document.getElementById("form-lugar").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const input = document.getElementById("input-lugar");
      const nombre = input.value.trim();
      if (!nombre) return;

      const boton = evento.target.querySelector("button");
      boton.disabled = true;
      try {
        const { error } = await supabase.rpc("agregar_lugar", { nombre_nuevo: nombre });
        if (!error) {
          input.value = "";
          await cargarTablaLugares();
        }
      } finally {
        boton.disabled = false;
      }
    });

    cargarFechas();
    cargarLugares();
    cargarTablaFechas();
    cargarTablaLugares();
  </script>
</body>
</html>
