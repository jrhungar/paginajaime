<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de sugerencias — Posada de fin de año</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #1a2027;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121820; color: #e8eef5; }
    header { background: #1b232e !important; border-color: #2b3644 !important; }
    .placeholder { background: #1b232e !important; border-color: #2b3644 !important; }
  }
  header {
    background: #fff; border-bottom: 1px solid #dde3ea;
    padding: 32px 20px 24px;
    text-align: center;
  }
  h1 {
    font-size: clamp(22px, 6vw, 30px);
    margin: 0 0 10px;
  }
  header p {
    margin: 0 auto; max-width: 480px;
    line-height: 1.55; font-size: 16px;
    opacity: .85;
  }
  main {
    max-width: 600px; margin: 0 auto;
    padding: 24px 20px 48px;
  }
  .placeholder {
    background: #fff; border: 1px dashed #c3ccd6; border-radius: 14px;
    padding: 40px 24px; text-align: center;
    color: inherit; opacity: .75;
  }
  .placeholder p { margin: 0; line-height: 1.55; }
</style>
</head>
<body>
  <header>
    <h1>Buzón de sugerencias — Posada de fin de año</h1>
    <p>Ayúdanos a hacer mejor la posada de este año: cuéntanos qué te
       gustaría que tuviera, qué cambiarías o cualquier idea que se te ocurra.</p>
  </header>
  <main>
    <div class="placeholder">
      <p>Aquí va a ir el formulario para dejar tu sugerencia.</p>
    </div>
  </main>
</body>
</html>
